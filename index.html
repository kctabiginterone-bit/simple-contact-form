<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Contact Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 id="page-heading">Contact Us</h1>
    <p class="subtitle">Please complete all fields and submit your message.</p>

    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>

      <button type="submit">Send Message</button>
    </form>

    <div id="confirmation" class="confirmation" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
